<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 52" fill="none">
  <!-- Card background - cream/off-white like real PAN -->
  <rect width="80" height="52" rx="4" fill="#FFFBF0" stroke="#e2e8f0" stroke-width="0.5"/>
  <!-- Top header - Income Tax blue -->
  <rect width="80" height="11" rx="4" fill="#003580"/>
  <rect y="7" width="80" height="4" fill="#003580"/>
  <!-- Govt of India emblem area -->
  <circle cx="8" cy="5.5" r="4" fill="none" stroke="#FFD700" stroke-width="0.8"/>
  <circle cx="8" cy="5.5" r="1" fill="#FFD700"/>
  <line x1="8" y1="1.5" x2="8" y2="9.5" stroke="#FFD700" stroke-width="0.4"/>
  <line x1="4" y1="5.5" x2="12" y2="5.5" stroke="#FFD700" stroke-width="0.4"/>
  <line x1="5.2" y1="2.7" x2="10.8" y2="8.3" stroke="#FFD700" stroke-width="0.4"/>
  <line x1="10.8" y1="2.7" x2="5.2" y2="8.3" stroke="#FFD700" stroke-width="0.4"/>
  <!-- Header text -->
  <text x="40" y="5" font-family="Arial,sans-serif" font-size="3.2" fill="white" text-anchor="middle" font-weight="bold">INCOME TAX DEPARTMENT</text>
  <text x="40" y="9" font-family="Arial,sans-serif" font-size="2.8" fill="#FFD700" text-anchor="middle">GOVT. OF INDIA</text>
  <!-- PAN label -->
  <text x="4" y="18" font-family="Arial,sans-serif" font-size="3" fill="#64748b">Permanent Account Number</text>
  <!-- PAN number - prominent -->
  <text x="4" y="25" font-family="Courier New,monospace" font-size="7" fill="#003580" font-weight="bold" letter-spacing="1">ABCDE1234F</text>
  <!-- Photo placeholder -->
  <rect x="60" y="13" width="16" height="20" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <circle cx="68" cy="19" r="4" fill="#93c5fd"/>
  <path d="M62 33 Q68 27 74 33" fill="#93c5fd"/>
  <!-- Name -->
  <text x="4" y="32" font-family="Arial,sans-serif" font-size="3" fill="#64748b">Name</text>
  <text x="4" y="37" font-family="Arial,sans-serif" font-size="4" fill="#1e293b" font-weight="bold">RAHUL SHARMA</text>
  <!-- DOB -->
  <text x="4" y="43" font-family="Arial,sans-serif" font-size="3" fill="#64748b">Date of Birth</text>
  <text x="4" y="48" font-family="Arial,sans-serif" font-size="3.5" fill="#1e293b">01/01/1990</text>
  <!-- Signature line -->
  <line x1="40" y1="47" x2="58" y2="47" stroke="#94a3b8" stroke-width="0.5"/>
  <text x="49" y="50.5" font-family="Arial,sans-serif" font-size="2.5" fill="#94a3b8" text-anchor="middle">Signature</text>
</svg>
