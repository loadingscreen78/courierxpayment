<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <rect width="120" height="40" rx="4" fill="#FF6600"/>
  <!-- India emblem simplified -->
  <g transform="translate(8, 6)">
    <!-- Ashoka wheel simplified -->
    <circle cx="12" cy="14" r="9" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <circle cx="12" cy="14" r="2" fill="#FFFFFF"/>
    <!-- Spokes -->
    <line x1="12" y1="5" x2="12" y2="23" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="3" y1="14" x2="21" y2="14" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="5.6" y1="7.6" x2="18.4" y2="20.4" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="18.4" y1="7.6" x2="5.6" y2="20.4" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="3.9" y1="10.5" x2="20.1" y2="17.5" stroke="#FFFFFF" stroke-width="0.6"/>
    <line x1="20.1" y1="10.5" x2="3.9" y2="17.5" stroke="#FFFFFF" stroke-width="0.6"/>
    <line x1="10.5" y1="5.4" x2="13.5" y2="22.6" stroke="#FFFFFF" stroke-width="0.6"/>
    <line x1="13.5" y1="5.4" x2="10.5" y2="22.6" stroke="#FFFFFF" stroke-width="0.6"/>
  </g>
  <!-- Text -->
  <text x="34" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="1">MeitY</text>
  <text x="34" y="29" font-family="Arial, sans-serif" font-size="6" fill="#FFD4A8" letter-spacing="0.3">Govt. of India</text>
</svg>
