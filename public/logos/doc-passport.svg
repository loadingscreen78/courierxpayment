<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 72" fill="none">
  <!-- Passport cover - navy blue like Indian passport -->
  <rect width="52" height="72" rx="4" fill="#1a3a6b"/>
  <!-- Emblem circle -->
  <circle cx="26" cy="22" r="12" fill="none" stroke="#FFD700" stroke-width="1"/>
  <circle cx="26" cy="22" r="4" fill="#FFD700" opacity="0.3"/>
  <circle cx="26" cy="22" r="1.5" fill="#FFD700"/>
  <!-- Ashoka chakra spokes -->
  <line x1="26" y1="10" x2="26" y2="34" stroke="#FFD700" stroke-width="0.6"/>
  <line x1="14" y1="22" x2="38" y2="22" stroke="#FFD700" stroke-width="0.6"/>
  <line x1="17.5" y1="13.5" x2="34.5" y2="30.5" stroke="#FFD700" stroke-width="0.5"/>
  <line x1="34.5" y1="13.5" x2="17.5" y2="30.5" stroke="#FFD700" stroke-width="0.5"/>
  <line x1="14.8" y1="17.5" x2="37.2" y2="26.5" stroke="#FFD700" stroke-width="0.4"/>
  <line x1="37.2" y1="17.5" x2="14.8" y2="26.5" stroke="#FFD700" stroke-width="0.4"/>
  <line x1="17.5" y1="30.5" x2="34.5" y2="13.5" stroke="#FFD700" stroke-width="0.4"/>
  <!-- INDIA text -->
  <text x="26" y="40" font-family="Georgia,serif" font-size="5" fill="#FFD700" text-anchor="middle" font-weight="bold">INDIA</text>
  <!-- PASSPORT text -->
  <text x="26" y="48" font-family="Georgia,serif" font-size="4" fill="white" text-anchor="middle">PASSPORT</text>
  <!-- Hindi text -->
  <text x="26" y="55" font-family="Arial,sans-serif" font-size="3.5" fill="#FFD700" text-anchor="middle">पासपोर्ट</text>
  <!-- MRZ lines at bottom -->
  <rect x="4" y="62" width="44" height="3" rx="0.5" fill="#2d5a9e" opacity="0.5"/>
  <rect x="4" y="67" width="44" height="3" rx="0.5" fill="#2d5a9e" opacity="0.5"/>
  <text x="6" y="64.5" font-family="Courier New,monospace" font-size="2.5" fill="#93c5fd">P&lt;INDSHARMA&lt;&lt;RAHUL&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
  <text x="6" y="69.5" font-family="Courier New,monospace" font-size="2.5" fill="#93c5fd">A1234567&lt;8IND9001011M2501014&lt;&lt;&lt;&lt;&lt;&lt;2</text>
</svg>
